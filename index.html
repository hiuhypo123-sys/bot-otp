<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Mã Xác Minh Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 12px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { color: #ffffff; margin-bottom: 15px; font-size: 22px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .countdown { font-size: 18px; color: #ff4757; font-weight: bold; margin-bottom: 20px; background: rgba(255, 71, 87, 0.1); padding: 10px; border-radius: 8px; display: inline-block; width: 100%; }
        .btn { background-color: #00ea8c; color: #121212; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; width: 100%; }
        .btn:hover { background-color: #00c473; transform: translateY(-2px); }
        .btn:disabled { background-color: #444; color: #888; cursor: not-allowed; transform: none; }
        .otp-box { margin-top: 25px; padding: 15px; background-color: #2a2a2a; border-radius: 8px; border: 1px dashed #00ea8c; display: none; }
        .otp-title { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .otp-code { font-size: 26px; font-weight: bold; color: #00ea8c; letter-spacing: 2px; }
        .error-msg { color: #ff4757; background: rgba(255, 71, 87, 0.1); padding: 15px; border-radius: 8px; border: 1px solid #ff4757; display: none; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="error-area" class="error-msg">
        ⚠️ <b>LỖI TRUY CẬP:</b> Không tìm thấy ID người dùng! Vui lòng thực hiện lại nhiệm vụ từ Bot Telegram.
    </div>

    <div id="main-area">
        <h2>Nhiệm Vụ Lấy Mã OTP</h2>
        <p>Vui lòng chờ hết thời gian đếm ngược để hệ thống kích hoạt nút lấy mã xác minh.</p>
        
        <div id="timer" class="countdown">Thời gian còn lại: 60 giây</div>
        
        <button id="action-btn" class="btn" disabled onclick="generateOTP()">Bấm Để Nhận Mã</button>
        
        <div id="otp-area" class="otp-box">
            <div class="otp-title">Mã OTP của bạn là:</div>
            <div id="otp-code" class="otp-code">-------</div>
        </div>
    </div>
</div>

<script>
    let timeLeft = 60; // Bạn có thể sửa số giây chờ tại đây (ví dụ: 15, 30, 60...)
    const timerEl = document.getElementById('timer');
    const btnEl = document.getElementById('action-btn');
    const errorArea = document.getElementById('error-area');
    const mainArea = document.getElementById('main-area');
    const otpArea = document.getElementById('otp-area');
    const otpCodeEl = document.getElementById('otp-code');

    // 1. Lấy tham số ?id= từ trên URL thanh địa chỉ
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');

    // Kiểm tra xem có ID hợp lệ không
    if (!userId || isNaN(userId)) {
        mainArea.style.display = 'none';
        errorArea.style.display = 'block';
    } else {
        // Bắt đầu đếm ngược nếu có ID chuẩn
        const countdown = setInterval(() => {
            timeLeft--;
            timerEl.innerText = `Thời gian còn lại: ${timeLeft} giây`;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerEl.style.display = 'none'; // Ẩn dòng chữ đếm ngược
                btnEl.removeAttribute('disabled'); // Mở khóa nút bấm lấy mã
            }
        }, 1000);
    }

    // 2. Hàm tính toán và hiển thị mã OTP ngẫu nhiên dựa trên ID
    function generateOTP() {
        // CÔNG THỨC TOÁN HỌC BÍ MẬT: Lấy ID từ Bot nhân với 3 rồi cộng thêm 2468
        // (Bạn nhớ cài đặt công thức này y hệt bên phía code của con Bot Telegram nhé)
        let calculatedCode = (parseInt(userId) * 3) + 2468;
        
        // Hiển thị mã OTP ra màn hình
        otpCodeEl.innerText = `LUC-${calculatedCode}`;
        otpArea.style.display = 'block';
        
        // Ẩn nút bấm đi để tránh người dùng click nhiều lần
        btnEl.style.display = 'none';
    }
</script>

</body>
</html>
