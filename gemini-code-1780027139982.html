<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Lấy Mã OTP</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #fff; text-align: center; padding: 50px; }
        .box { background: #2d2d2d; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn { background-color: #ff4757; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        #otp-display { font-size: 24px; font-weight: bold; color: #2ed573; margin-top: 20px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Nhiệm Vụ Lấy Mã Xác Minh Bot</h2>
    <p>Vui lòng chờ hết thời gian để nhận mã OTP của bạn.</p>
    
    <!-- Bộ đếm ngược thời gian -->
    <h3 id="countdown">Thời gian còn lại: 60 giây</h3>
    
    <!-- Nút bấm lấy mã (bị ẩn/khóa lúc đầu) -->
    <button id="get-code-btn" class="btn" disabled onclick="showOTP()">Bấm vào đây để lấy mã</button>
    
    <!-- Nơi hiển thị mã OTP -->
    <div id="otp-display"></div>
</div>

<script>
    let timeLeft = 60; // Bạn có thể chỉnh số giây chờ ở đây
    const countdownEl = document.getElementById('countdown');
    const btnEl = document.getElementById('get-code-btn');
    const otpDisplayEl = document.getElementById('otp-display');

    // Hàm đếm ngược thời gian
    const timer = setInterval(() => {
        timeLeft--;
        countdownEl.innerText = `Thời gian còn lại: ${timeLeft} giây`;
        
        if (timeLeft <= 0) {
            clearInterval(timer);
            countdownEl.innerText = "Bạn đã có thể lấy mã!";
            btnEl.removeAttribute('disabled'); // Mở khóa nút bấm
        }
    }, 1000);

    // Hàm lấy tham số từ URL và tạo OTP ngẫu nhiên dựa trên tham số đó
    function showOTP() {
        // Lấy phần "?id=xxxx" từ thanh địa chỉ
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        if (!userId) {
            otpDisplayEl.innerText = "Lỗi: Không tìm thấy ID từ Bot!";
            return;
        }

        // CÔNG THỨC BÍ MẬT: Ví dụ lấy ID nhân 2 rồi cộng thêm 13579
        // Bạn có thể tự đổi công thức này theo ý mình, miễn là Bot cũng làm phép tính y hệt
        let secretCode = (parseInt(userId) * 2) + 13579;

        // Hiển thị mã lên màn hình cho người dùng copy
        otpDisplayEl.innerText = `MÃ OTP CỦA BẠN LÀ: LUC-${secretCode}`;
        btnEl.style.display = 'none'; // Ấn nút sau khi bấm xong
    }
</script>

</body>
</html>
